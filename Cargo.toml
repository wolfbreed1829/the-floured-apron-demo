[package]
name = "the-floured-apron"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
leptos = { version = "=0.8.22", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "HtmlDialogElement", "Navigator", "Clipboard"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
